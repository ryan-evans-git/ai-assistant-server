name: ci

# Linux-only matrix on purpose: GitHub-hosted macOS runners are
# billed at 10× Linux. Pure-Python repo, no native code, so Linux
# coverage is sufficient.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit pip-audit pip-licenses

      - name: Ruff (lint)
        run: ruff check ai_assistant_server tests

      - name: Bandit (medium+ severity, no findings allowed)
        # `-ll` gates on medium-or-higher severity; low is
        # informational. Tests are excluded — assert + temp-file
        # patterns are noise here.
        run: bandit -r ai_assistant_server -ll

      - name: pip-audit (Python deps)
        # Fails on any unsuppressed advisory in the resolved
        # dependency tree. `--skip-editable` excludes the in-tree
        # `ai-assistant-server` install.
        run: pip-audit --skip-editable

      - name: License check (block GPL/AGPL/SSPL/BUSL/Elastic)
        # Substring match against each dep's license string.  Exact
        # forms picked to avoid false-matching LGPL (which is
        # weak-copyleft and acceptable for runtime/dynamic linking).
        # MPL stays OK (file-level copyleft); add it here if policy
        # tightens.
        run: |
          pip-licenses --fail-on="GPL-2.0;GPL-3.0;GPLv2;GPLv3;AGPL;Affero;SSPL;Server Side Public;BUSL;Business Source;Elastic License;Commons Clause"

      - name: pytest (with branch coverage gate ≥90%)
        run: pytest -q --cov=ai_assistant_server --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: Validate sample tool specs
        # The repo ships YAML OpenAPI specs under tools/. Smoke-load
        # each through the loader to catch breakage in the parser
        # whenever a sample spec is added or updated.
        run: |
          python - <<'PY'
          import pathlib, sys
          from ai_assistant_server.loader import load_tools_from_directory
          tools_dir = pathlib.Path("tools")
          if not tools_dir.exists():
              sys.exit(0)
          tools = load_tools_from_directory(tools_dir)
          print(f"Loaded {len(tools)} tools from {tools_dir}")
          PY

  trivy:
    name: trivy (filesystem + Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy Dockerfile scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  docker-build:
    name: docker build (sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t ai-assistant-server:ci .
