name: gitleaks

# Scan every push + PR for accidentally committed secrets. The
# action defaults to the upstream gitleaks ruleset (AWS keys,
# GitHub tokens, Anthropic / OpenAI / Google keys, generic
# high-entropy strings, etc.).

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit reachable
          # from the PR head, not just the diff.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
