[project]
name = "ai-assistant-server"
version = "0.1.0"
description = "OpenAPI/Swagger-driven MCP server with per-request credential forwarding for multi-tenant deployments. Drop a spec into tools/ and every operation becomes a typed MCP tool over stdio or SSE."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "ryan-evans-git" },
]
keywords = ["mcp", "model-context-protocol", "openapi", "swagger", "claude", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "respx>=0.21.0",
]

[project.scripts]
ai-assistant-server = "ai_assistant_server.server:main"

[project.urls]
Homepage = "https://github.com/ryan-evans-git/ai-assistant-server"
Repository = "https://github.com/ryan-evans-git/ai-assistant-server"
Issues = "https://github.com/ryan-evans-git/ai-assistant-server/issues"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_assistant_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ai_assistant_server"]

[tool.coverage.report]
# Exclude transport runners — these are thin wrappers over the MCP
# SDK's stream contracts that would require mocking the SDK in
# significant detail to exercise meaningfully.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
omit = []
fail_under = 90
show_missing = true
skip_covered = false
